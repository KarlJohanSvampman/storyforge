services:
  frontend:
    build:
      context: ./frontend
    container_name: storyforge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: storyforge-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storyforge_documentary_media:/app/storage/documentary
      - storyforge_production_media:/app/storage/production-audio
    environment:
      DATABASE_URL: postgresql+psycopg://storyforge:change-me-locally@db:5432/storyforge
      STORYFORGE_AUTH_MODE: development
      STORYFORGE_DEV_USER_EMAIL: storyteller@storyforge.local
      STORYFORGE_DEV_USER_NAME: Storyteller
      STORYFORGE_MEDIA_DIR: /app/storage/documentary
      STORYFORGE_PRODUCTION_MEDIA_DIR: /app/storage/production-audio
    depends_on:
      audio-renderer:
    build:
      context: ./backend
    container_name: storyforge-audio-renderer
    command:
      - sh
      - -c
      - until python -c "import urllib.request; urllib.request.urlopen('http://backend:8000/api/health', timeout=2)" >/dev/null 2>&1; do sleep 2; done; python -m app.audio_render_worker
    volumes:
      - ./backend:/app
      - storyforge_production_media:/app/storage/production-audio
    environment:
      DATABASE_URL: postgresql+psycopg://storyforge:change-me-locally@db:5432/storyforge
      STORYFORGE_PRODUCTION_MEDIA_DIR: /app/storage/production-audio
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

  db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: storyforge-db
    environment:
      POSTGRES_DB: storyforge
      POSTGRES_USER: storyforge
      POSTGRES_PASSWORD: change-me-locally
    ports:
      - "5432:5432"
    volumes:
      - storyforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyforge -d storyforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  frontend_node_modules:
  storyforge_postgres_data:
  storyforge_documentary_media:
  storyforge_production_media:
