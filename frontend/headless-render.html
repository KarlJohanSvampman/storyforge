<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryForge Headless Renderer</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101510; }
    body { display: grid; place-items: center; }
    #frame { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    #status { position: fixed; left: 12px; bottom: 12px; color: #dce6d3; font: 12px sans-serif; }
  </style>
</head>
<body>
  <canvas id="frame" width="1280" height="720"></canvas>
  <div id="status">Renderer booting…</div>
  <script type="module" src="/src/headless-render.ts"></script>
</body>
</html>
