name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend migration and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: storyforge
          POSTGRES_USER: storyforge
          POSTGRES_PASSWORD: storyforge-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storyforge -d storyforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://storyforge:storyforge-ci@127.0.0.1:5432/storyforge
      STORYFORGE_AUTH_MODE: development
      STORYFORGE_DEV_USER_EMAIL: ci@storyforge.local
      STORYFORGE_DEV_USER_NAME: StoryForge CI
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Apply all database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q tests

  frontend:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
